<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dorm Manager</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login-box">
<h2>🔐 เข้าสู่ระบบผู้ดูแล</h2><p>ระบบนี้มีผู้ดูแลเพียงบัญชีเดียว</p>
<form onsubmit="login(event)"><label>อีเมลผู้ดูแล<input id="email" type="email" autocomplete="username" placeholder="admin@manager.com" required></label><label>รหัสผ่าน Firebase<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">เข้าสู่ระบบ</button></form><p id="loginError" class="bad"></p>
</div>
<div id="system" style="display:none">
<header><h1>🏠 Dorm Manager</h1><span>ระบบจัดการหอพักส่วนตัว</span><button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="สลับโหมด">🌙</button></header>
<nav class="sidebar">
<div class="sidebar-brand"><span class="brand-mark">⌂</span><div><strong>R&m HOUSE</strong><small>Dorm Manager</small></div></div>
<button class="nav-item active" onclick="show('dashboard')"><span>⌂</span>ภาพรวม</button><button class="nav-item" onclick="show('rooms')"><span>▦</span>ห้องพัก</button>
<button class="nav-item" onclick="show('tenants')"><span>♙</span>ผู้เช่า</button><button class="nav-item" onclick="show('meters')"><span>▤</span>มิเตอร์น้ำ-ไฟ</button><button class="nav-item" onclick="show('bills')"><span>฿</span>บิล/ชำระเงิน</button><button class="nav-item" onclick="show('settings')"><span>⚙</span>ตั้งค่าระบบ</button><div class="nav-divider"></div><button class="nav-item logout-item" onclick="logout()"><span>⇥</span>ออกจากระบบ</button>
</nav>
<main id="app"></main>
</div><script type="module" src="firebase-auth.js"></script><script src="api-config.js?v=20261026"></script><script src="app.js?v=20261026-render"></script>
</body></html>
